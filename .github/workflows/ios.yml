# Builds the Weather Bear iPhone app on GitHub's Mac machines (free for public repos).
#
# - Every push to the app branch, and every pull request, runs "Build check":
#   an unsigned simulator build that proves the app compiles. No Apple account needed.
# - "Upload to TestFlight" runs only when started by hand (Actions tab > iOS > Run workflow
#   > upload = true). The Team ID (LGCD527TGY, Ken's individual account) is in the project and
#   ExportOptions.plist. It needs these repository secrets from App Store Connect:
#     ASC_KEY_ID               App Store Connect API key ID
#     ASC_ISSUER_ID            App Store Connect API issuer ID
#     ASC_API_KEY_P8           full text of the downloaded AuthKey_XXXX.p8 file
#   The key needs the Admin role so Xcode can create the distribution certificate in the cloud.
name: iOS

on:
  push:
    branches: [ios-app-store]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload a build to TestFlight"
        type: boolean
        default: false
      register_ids:
        description: "Register the app and widget bundle IDs with Apple"
        type: boolean
        default: false

jobs:
  # Registers com.kenlill.weatherbear and its widget ID through the App Store Connect API, so the
  # app can be picked when creating the App Store Connect listing. Safe to run twice.
  register-ids:
    name: Register bundle IDs
    if: github.event_name == 'workflow_dispatch' && inputs.register_ids
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet pyjwt cryptography requests
      - name: Register
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        shell: python
        run: |
          import os, time, jwt, requests
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                           os.environ["ASC_API_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {tok}"}
          api = "https://api.appstoreconnect.apple.com/v1/bundleIds"
          for ident, name in [("com.kenlill.weatherbear", "Weather Bear"), ("com.kenlill.weatherbear.widget", "Weather Bear Widget")]:
              r = requests.get(api, headers=h, params={"filter[identifier]": ident}, timeout=30)
              r.raise_for_status()
              if any(d["attributes"]["identifier"] == ident for d in r.json()["data"]):
                  print(f"{ident}: already registered"); continue
              r = requests.post(api, headers=h, timeout=30, json={"data": {"type": "bundleIds", "attributes": {"identifier": ident, "name": name, "platform": "IOS"}}})
              print(f"{ident}: HTTP {r.status_code}")
              if r.status_code >= 300: print(r.text); r.raise_for_status()

  build-check:
    name: Build check
    if: github.event_name != 'workflow_dispatch' || inputs.upload || !inputs.register_ids
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build web assets and sync into the iOS project
        run: |
          npm ci
          npm run sync
      - run: xcodebuild -version
      - name: Build for the iPhone simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: build-check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build web assets and sync into the iOS project
        run: |
          npm ci
          npm run sync
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (signed automatically in the cloud)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/WeatherBear.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/WeatherBear.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
