name: Radar check
on:
  push:
    branches: [radar-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          git fetch -q origin bear && mkdir -p site && git --work-tree=site checkout origin/bear -- . && git reset -q
          mkdir -p out
          (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node diag/palette.mjs; node diag/radar.mjs http://localhost:8080
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf shots && mkdir shots && cp out/*.png shots/ && git add shots && git commit -qm "Diagnostic screenshots" && git push -q origin HEAD:radar-check
