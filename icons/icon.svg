<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Weather Bear</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FB5"/>
      <stop offset="1" stop-color="#8CCBF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FFE38A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6438"/>
      <stop offset="1" stop-color="#7A4A26"/>
    </linearGradient>
  </defs>
  <!-- Sky, full bleed (iOS rounds the corners itself) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Sun peeking over the bear's right ear -->
  <circle cx="770" cy="250" r="230" fill="url(#glow)"/>
  <circle cx="770" cy="250" r="140" fill="#FFC53D"/>
  <!-- Little cloud on the left -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="170" cy="250" r="62"/>
    <circle cx="240" cy="215" r="80"/>
    <circle cx="315" cy="255" r="58"/>
    <rect x="120" y="250" width="240" height="62" rx="31"/>
  </g>
  <!-- Ears -->
  <circle cx="300" cy="420" r="118" fill="url(#fur)"/>
  <circle cx="724" cy="420" r="118" fill="url(#fur)"/>
  <circle cx="300" cy="420" r="62" fill="#D59A66"/>
  <circle cx="724" cy="420" r="62" fill="#D59A66"/>
  <!-- Head -->
  <ellipse cx="512" cy="660" rx="330" ry="300" fill="url(#fur)"/>
  <!-- Eyes -->
  <circle cx="404" cy="600" r="34" fill="#24150B"/>
  <circle cx="620" cy="600" r="34" fill="#24150B"/>
  <circle cx="415" cy="589" r="11" fill="#FFFFFF"/>
  <circle cx="631" cy="589" r="11" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <ellipse cx="340" cy="705" rx="42" ry="26" fill="#E88A7A" opacity="0.55"/>
  <ellipse cx="684" cy="705" rx="42" ry="26" fill="#E88A7A" opacity="0.55"/>
  <!-- Muzzle -->
  <ellipse cx="512" cy="742" rx="158" ry="122" fill="#F0CFA6"/>
  <!-- Nose -->
  <path d="M452 682 Q512 650 572 682 Q572 726 512 744 Q452 726 452 682 Z" fill="#2E1B10"/>
  <ellipse cx="494" cy="680" rx="16" ry="8" fill="#FFFFFF" opacity="0.45"/>
  <!-- Smile -->
  <path d="M512 744 L512 772 M452 778 Q482 812 512 772 Q542 812 572 778" fill="none" stroke="#2E1B10" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
